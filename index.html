<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Atelier Matrec – Essai</title><style>body{font:16px Arial;background:#f3f6fa;color:#15263b;margin:0}header{background:#123653;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}section{background:white;border-radius:10px;padding:16px;margin:14px 0}form{display:flex;flex-wrap:wrap;gap:12px}label{display:grid;gap:5px;min-width:160px;flex:1}input,select,button{font:inherit;padding:10px;border:1px solid #b5c0ca;border-radius:6px}button{background:#145e9b;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px;overflow:auto}.column{background:#eef2f6;padding:8px;border-radius:7px}.entry{border-radius:7px;padding:10px;margin:8px 0}.notice{background:#fff1cc;padding:12px;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:repeat(4,minmax(200px,1fr))}}</style></head><body><header><h2>Agenda Atelier Matrec – Version d'essai</h2>Michel Gagnon · Daniel Roy · Benoît Paiement · Externe</header><main><p class="notice">Démonstration publique : utiliser seulement des numéros de camions fictifs. Les données restent sur cet appareil. Aucune connexion à M5, Google Drive ou Gmail n'est active.</p><section><h3>Ajouter un rendez-vous</h3><form id="form"><label>Date<input id="date" type="date" required></label><label>Début<input id="start" type="time" value="08:00" required></label><label>Fin<input id="end" type="time" value="09:00" required></label><label>Camion fictif<input id="truck" placeholder="TEST-125" required></label><label>Division<select id="division"><option>Matrec</option><option>SSAD</option></select></label><label>Mécanicien / lieu<select id="worker"><option>Michel Gagnon</option><option>Daniel Roy</option><option>Benoît Paiement</option><option>Externe</option></select></label><label>Couleur / statut<select id="status"><option>Rendez-vous</option><option>Pièce en commande</option><option>Arrêt</option><option>Réparation à faire</option><option>Hors service</option></select></label><label>Travaux<select id="kind"><option>Réparation</option><option>PM</option><option>Externe</option></select></label><label>Notes<input id="notes"></label><button>Enregistrer</button></form></section><section><button id="prev">◀ Semaine</button> <b id="week"></b> <button id="next">Semaine ▶</button> <button id="export">Exporter CSV</button></section><div id="calendar"></div></main><script>
const $=id=>document.getElementById(id),names=['Michel Gagnon','Daniel Roy','Benoît Paiement','Externe'],colors={'Pièce en commande':'#22d7c7','Rendez-vous':'#ed9629','Arrêt':'#f2e12b','Réparation à faire':'#24b9e6','Hors service':'#e51e2b'};let events=[];try{events=JSON.parse(localStorage.getItem('matrec-demo-v1')||'[]')}catch{}let monday=new Date();monday.setHours(12,0,0,0);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('date').value=iso(new Date());const save=()=>localStorage.setItem('matrec-demo-v1',JSON.stringify(events));function node(tag,txt){let e=document.createElement(tag);e.textContent=txt||'';return e}function render(){let root=$('calendar');root.replaceChildren();let end=new Date(monday);end.setDate(end.getDate()+5);$('week').textContent=monday.toLocaleDateString('fr-CA')+' – '+end.toLocaleDateString('fr-CA');for(let i=0;i<6;i++){let d=new Date(monday);d.setDate(d.getDate()+i);let sec=node('section');sec.append(node('h3',d.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})+(i===5?' (externe 7 h–12 h)':'')));let grid=node('div');grid.className='grid';for(let name of (i===5?['Externe']:names)){let col=node('div');col.className='column';col.append(node('h4',name));for(let a of events.filter(x=>x.date===iso(d)&&x.worker===name).sort((a,b)=>a.start.localeCompare(b.start))){let entry=node('div');entry.className='entry';entry.style.background=colors[a.status];entry.append(node('b',a.start+'–'+a.end+' '+a.truck),node('div',a.division+' · '+a.kind),node('div',a.status),node('div',a.notes));let del=node('button','Supprimer');del.onclick=()=>{if(confirm('Supprimer ce rendez-vous?')){events=events.filter(x=>x.id!==a.id);save();render()}};entry.append(del);if(a.kind==='Externe'||a.kind==='PM'){let email=node('button','Préparer Gmail');email.onclick=()=>{if(!confirm('Préparer un courriel au répartiteur '+a.division+'? Il ne sera pas envoyé automatiquement.'))return;let subject='Rendez-vous '+a.kind+' – '+a.truck;let body='Bonjour,\n\nCamion : '+a.truck+'\nDivision : '+a.division+'\nDate : '+a.date+'\nHeure : '+a.start+' à '+a.end+'\nTravaux : '+a.notes+'\n\nMerci';window.open('https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body),'_blank')};entry.append(email)}col.append(entry)}grid.append(col)}sec.append(grid);root.append(sec)}}$('form').onsubmit=e=>{e.preventDefault();let x={id:Date.now(),date:$('date').value,start:$('start').value,end:$('end').value,truck:$('truck').value,division:$('division').value,worker:$('worker').value,status:$('status').value,kind:$('kind').value,notes:$('notes').value};let day=new Date(x.date+'T12:00:00').getDay();if(day===0)return alert('Dimanche fermé');if(x.end<=x.start)return alert('Heure de fin invalide');if(day===6&&(x.worker!=='Externe'||x.kind!=='Externe'||x.start<'07:00'||x.end>'12:00'))return alert('Samedi : externe seulement, 7 h à 12 h');if(day!==6&&(x.start<'06:00'||x.end>'22:00'))return alert('Lundi à vendredi : 6 h à 22 h');events.push(x);save();monday=new Date(x.date+'T12:00:00');monday.setDate(monday.getDate()-(monday.getDay()+6)%7);render();$('truck').value='';$('notes').value=''};$('prev').onclick=()=>{monday.setDate(monday.getDate()-7);render()};$('next').onclick=()=>{monday.setDate(monday.getDate()+7);render()};$('export').onclick=()=>{let rows=[['Date','Début','Fin','Camion','Division','Assigné','Statut','Type','Notes'],...events.map(x=>[x.date,x.start,x.end,x.truck,x.division,x.worker,x.status,x.kind,x.notes])];let data='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\r\n');let a=node('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='agenda-matrec.csv';a.click()};render();
</script></body></html>
